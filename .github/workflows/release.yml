name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches cli version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./cli/package.json').version")"
          test "${TAG}" = "v${VERSION}" || {
            echo "Tag ${TAG} does not match cli/package.json version ${VERSION}"
            exit 1
          }

      - name: Build CLI
        working-directory: cli
        run: npm run build

      - name: Require npm publish token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NPM_TOKEN}" || {
            echo "::error::NPM_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions (an npm token with publish rights for @reposell/repo-shield), then push a new v* tag."
            exit 1
          }

      - name: Publish to npm
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}