name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Ensure modern npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches cli version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./cli/package.json').version")"
          test "${TAG}" = "v${VERSION}" || {
            echo "Tag ${TAG} does not match cli/package.json version ${VERSION}"
            exit 1
          }

      - name: Build CLI
        working-directory: cli
        run: npm run build

      - name: Prepare OIDC publish (strip setup-node placeholder token)
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"
          env | grep -E '^ACTIONS_ID_TOKEN_' | sed 's/=.*/=present/'
          npm --version

      - name: Publish to npm
        working-directory: cli
        continue-on-error: true
        run: npm publish --provenance --access public --loglevel=silly

      - name: Dump npm debug log (OIDC exchange detail)
        if: ${{ always() }}
        run: |
          latest=$(ls -t "$HOME/.npm/_logs" 2>/dev/null | head -1)
          echo "latest_log=$latest"
          rg -i "oidc|authToken|exchange|npm http fetch POST|error" "$HOME/.npm/_logs/$latest" 2>/dev/null | tail -40